# GitLab CI for Edi
#
# The runtime image is Ubuntu 22.04 (glibc 2.35) so the packaged binary runs on
# older desktop Linux systems. Python 3.10 comes from apt; Node 22 is fetched
# as a static tarball.
#
# Requires the following CI/CD variables for the `release` job:
#   GITLAB_TOKEN   a GitLab token with `api` scope and Maintainer role on this
#                  project, used to publish releases via the glab CLI. If you
#                  self-host GitLab, also set GITLAB_HOST.

stages:
  - check
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  NODE_MAJOR: "22"
  NODE_VERSION: "22.22.1"
  QT_QPA_PLATFORM: "offscreen"
  QTWEBENGINE_DISABLE_SANDBOX: "1"

cache:
  key:
    files:
      - package-lock.json
      - requirements.txt
  paths:
    - node_modules/
    - .venv/
    - .cache/pip/

default:
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
      python3 python3-venv libpython3.10 binutils
      libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1
      libxkbcommon0 libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2
      libgbm1 libasound2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xkb1
      libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 libxcb-xinerama0
      libxcb-render-util0 libxkbfile1 libxtst6 libxfixes3 libkrb5-3
      libgssapi-krb5-2 fonts-dejavu-core
    - curl -fsS "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" | tar -xJ -C /usr/local --strip-components=1
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements.txt
    - npm ci --no-audit --no-fund

check:
  stage: check
  script:
    - npm run check

test:
  stage: test
  script:
    - npm run coverage
    - .venv/bin/pytest tests/
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build:
  stage: build
  artifacts:
    name: edi-$CI_COMMIT_TAG
    paths:
      - dist-app/edi
    expire_in: 30 days
  script:
    - npm run build
    - .venv/bin/pip install --no-cache-dir "pyinstaller==6.22.0"
    - .venv/bin/pyinstaller --clean --distpath dist-app --workpath build edi.spec
    - timeout 90 ./dist-app/edi | grep 'SELFTEST'

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  artifacts:
    paths:
      - dist-app/edi
    expire_in: never
  script:
    - export GITLAB_TOKEN="$GITLAB_TOKEN"
    - GLAB_VERSION=$(curl -sL https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases/permalink/latest | jq -r '.tag_name')
    - curl -sL "https://gitlab.com/gitlab-org/cli/-/releases/download/${GLAB_VERSION}/glab_${GLAB_VERSION#v}_Linux_x86_64.tar.gz" | tar -xz -C /tmp
    - /tmp/bin/glab release create "$CI_COMMIT_TAG"
      --name "Edi $CI_COMMIT_TAG"
      --notes "Automated release for Edi $CI_COMMIT_TAG."
      dist-app/edi
