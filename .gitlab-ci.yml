# GitLab CI for Edi
#
# The runtime image is Ubuntu 22.04 (glibc 2.35) so the packaged binary runs on
# older desktop Linux systems. Python 3.10 comes from apt; Node 22 is fetched
# as a static tarball.
#
# The `release` job authenticates glab via CI auto-login: it uses the built-in
# CI_JOB_TOKEN (JOB-TOKEN header) because a GITLAB_TOKEN personal access token
# is sent as a PRIVATE-TOKEN header, which the Releases API rejects with a 404.
# No GITLAB_TOKEN / GITLAB_HOST CI variable is needed.
#
# Requires the project setting "Allow CI job token to create releases" to be
# enabled (Settings > CI/CD > Token access; enabled by default on new projects).

stages:
  - check
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  NODE_MAJOR: "22"
  NODE_VERSION: "22.22.1"
  GLAB_VERSION: "v1.113.0"
  QT_QPA_PLATFORM: "offscreen"
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  # Chromium in containers: /dev/shm is tiny and the GPU is absent, so
  # QtWebEngine can hang while loading pages. Force software rendering and
  # temp-file-backed shared memory.
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-dev-shm-usage --disable-gpu"
  PYTHONUNBUFFERED: "1"

cache:
  key:
    files:
      - package-lock.json
      - requirements.txt
  paths:
    - node_modules/
    - .venv/
    - .cache/pip/

default:
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
      curl xz-utils ca-certificates git
      python3 python3-venv libpython3.10 binutils
      libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1
      libxkbcommon0 libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2
      libgbm1 libasound2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xkb1
      libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 libxcb-xinerama0
      libxcb-render-util0 libxkbfile1 libxtst6 libxfixes3 libkrb5-3
      libgssapi-krb5-2 fonts-dejavu-core
      libpcsclite1 libpulse0 libwayland-cursor0 libwayland-egl1
      libwayland-server0
      libgl1-mesa-dri libegl-mesa0 libglx-mesa0
    - curl -fsS "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" | tar -xJ -C /usr/local --strip-components=1
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements.txt
    - npm ci --no-audit --no-fund

check:
  stage: check
  script:
    - npm run check

test:
  stage: test
  script:
    - npm run coverage
    - npm run build
    - .venv/bin/pytest tests/
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build:
  stage: build
  artifacts:
    name: edi-$CI_COMMIT_TAG
    paths:
      - dist-app/edi
    expire_in: 30 days
  script:
    - npm run build
    - .venv/bin/pip install --no-cache-dir "pyinstaller==6.22.0"
    - .venv/bin/pyinstaller --clean --distpath dist-app --workpath build edi.spec
    # EDI_SELFTEST=1 makes the binary print "SELFTEST {...}" (or
    # "SELFTEST_TIMEOUT" after 25s) and exit 0/1 accordingly; rely on the exit
    # code, not grep, so a timeout line can't be mistaken for success. The
    # outer `timeout` is only a last-resort backstop if the process hangs.
    - EDI_SELFTEST=1 timeout 60 ./dist-app/edi

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  artifacts:
    paths:
      - dist-app/edi
    expire_in: never
  # GLAB_ENABLE_CI_AUTOLOGIN makes glab authenticate with the predefined
  # CI_JOB_TOKEN (JOB-TOKEN header) instead of a PRIVATE-TOKEN.
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - curl -sL "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION#v}/downloads/glab_${GLAB_VERSION#v}_linux_amd64.tar.gz" | tar -xz -C /tmp
    # The runner checks out a shallow clone (depth 20), so fetch full history
    # and all tags to build a changelog against the previous release. If the
    # repo is already complete (fewer commits than the depth), --unshallow
    # errors and a plain tag fetch is enough.
    - git fetch --tags --prune --unshallow 2>/dev/null || git fetch --tags --prune
    # Generate the changelog: every commit since the previous tag (or the full
    # history for the first release) as "- <short-hash> <subject>" lines. The
    # short hashes are auto-linked to commits by GitLab.
    - |
      PREV_TAG=$(git describe --abbrev=0 --tags "${CI_COMMIT_TAG}^" 2>/dev/null || true)
      RANGE="${CI_COMMIT_TAG}"
      [ -n "$PREV_TAG" ] && RANGE="${PREV_TAG}..${CI_COMMIT_TAG}"
      printf '## Changes in %s\n\n' "$CI_COMMIT_TAG" > /tmp/CHANGELOG.md
      git log --pretty=format:'- %h %s' "$RANGE" >> /tmp/CHANGELOG.md
      printf '\n' >> /tmp/CHANGELOG.md
    - /tmp/bin/glab release create "$CI_COMMIT_TAG"
      --name "Edi $CI_COMMIT_TAG"
      --notes-file /tmp/CHANGELOG.md
      --ref "$CI_COMMIT_SHA"
      dist-app/edi
