# GitLab CI for Edi
#
# All jobs run in a pre-built builder image (`edi-builder:jammy`) pushed to the
# project's container registry by the `build-image` job: Ubuntu 22.04 (glibc
# 2.35) with the Qt runtime libs, Node 22, and a venv at /opt/edi/venv holding
# PySide6==6.11.1, pyinstaller==6.22.0, pytest, pytest-qt, pytest-cov. Building
# that image is the single expensive setup step; it is cached in the registry
# (buildx cache) and only rebuilt when Dockerfile.ci / requirements.txt change.
#
# Jobs link the baked venv into the checkout (`ln -s /opt/edi/venv .venv`)
# because scripts/package-linux.sh hardcodes $ROOT/.venv. The venv is a
# read-only image layer — never pip-install into it at job time; bake changes
# into the image instead.
#
# The runtime binary is built inside the SAME glibc 2.35 base (Dockerfile.pyzip)
# so the packaged binary runs on older desktop Linux. glibc compatibility is
# guaranteed by construction: the `build` job's environment is the same
# ubuntu:22.04 as Dockerfile.pyzip.
#
# The `release` job authenticates glab via CI auto-login: it uses the built-in
# CI_JOB_TOKEN (JOB-TOKEN header) because a GITLAB_TOKEN personal access token
# is sent as a PRIVATE-TOKEN header, which the Releases API rejects with a 404.
# No GITLAB_TOKEN / GITLAB_HOST CI variable is needed.
#
# Requires the project setting "Allow CI job token to create releases" to be
# enabled (Settings > CI/CD > Token access; enabled by default on new projects).

stages:
  - prepare
  - test
  - build
  - package
  - release

variables:
  # Cache npm's registry cache (project-local) instead of node_modules/: npm ci
  # deletes node_modules anyway, and the npm cache makes the reinstall offline.
  # There is no pip cache anymore — the venv is baked into the builder image.
  NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm
  GLAB_VERSION: "v1.113.0"
  QT_QPA_PLATFORM: "offscreen"
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  # Chromium in containers: /dev/shm is tiny and the GPU is absent, so
  # QtWebEngine can hang while loading pages. Force software rendering and
  # temp-file-backed shared memory.
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-dev-shm-usage --disable-gpu"
  PYTHONUNBUFFERED: "1"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  # Populated by build-image (prepare stage). `needs: {job: build-image,
  # optional: true}` lets pipelines skip the build when nothing changed; the
  # registry copy persists between pipelines. NOTE: fork/MR pipelines that run
  # before the image exists in the fork's registry will fail to pull it.
  image: $CI_REGISTRY_IMAGE/edi-builder:jammy

# Link the baked venv into the checkout; used by every Qt/PySide6 job.
.setup_venv: &setup_venv
  - ln -s /opt/edi/venv .venv

# Builds and pushes the shared builder image so downstream jobs skip apt/Node/
# venv setup. Runs on the default branch when the image definition OR the CI
# config itself changes (the job lives in .gitlab-ci.yml); the registry buildx
# cache keeps rebuilds fast. To force a rebuild, touch Dockerfile.ci or
# requirements.txt. It does NOT run on tag pipelines: main rebuilds the image
# whenever its definition changes, so a release tag (cut after main passes)
# always finds it. (No `when: manual` fallback: a paused manual job would
# block every `needs` dependent via the DAG.)
build-image:
  stage: prepare
  image: docker:27-dind
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile.ci
        - requirements.txt
        - .gitlab-ci.yml
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # The default "docker" buildx driver cannot export a registry cache
    # ("Cache export is not supported for the docker driver"); use the
    # docker-container (BuildKit-in-a-container) driver instead.
    - docker buildx create --name edi-builder --driver docker-container --use --bootstrap
    # Must pass -f Dockerfile.ci explicitly: the repo also contains a plain
    # "Dockerfile" (the app's container image), which buildx would build by
    # default -- an image with no node and a venv at /app/.venv instead of
    # /opt/edi/venv.
    - docker buildx build --push --progress=plain
      -f Dockerfile.ci
      -t "$CI_REGISTRY_IMAGE/edi-builder:jammy"
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/edi-builder:cache"
      --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE/edi-builder:cache,mode=max"
      .

test:
  stage: test
  needs:
    - job: build-image
      optional: true
  before_script:
    - *setup_venv
    - npm ci --no-audit --no-fund
  # The whole quality gate lives here: lint + typecheck before the unit tests
  # (coverage) and backend pytest (which also reports coverage via pytest-cov),
  # so branch/MR pipelines get full feedback from a single job.
  script:
    - npm run lint
    - npm run typecheck
    - npm run coverage
    - npm run build
    - .venv/bin/pytest tests/
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        # Merge both cobertura reports into one set of MR diff annotations:
        # frontend (src/, from `npm run coverage`) and backend (backend/, from
        # pytest-cov via pyproject.toml addopts). GitLab merges wildcard
        # matches, so keep the two output paths consistent here.
        coverage_format: cobertura
        path: '**/cobertura-coverage.xml'

# The frontend bundle and application icons are byte-for-byte identical on
# every platform, so produce them once (on the pinned Node 22 builder image)
# and share them with the Linux and Windows binary jobs instead of rebuilding
# per-OS. This also keeps the ~193 MB PyInstaller payload out of the Windows
# job's artifact downloads. On v* tags only; `build` and `build-windows`
# consume the artifacts via `needs`.
frontend:
  stage: build
  needs:
    - job: build-image
      optional: true
  before_script:
    - npm ci --no-audit --no-fund
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  artifacts:
    name: edi-web-$CI_COMMIT_TAG
    paths:
      - dist/
      - scripts/assets/app-icon.ico
      - scripts/assets/app-icon.icns
    expire_in: 30 days
  script:
    - node scripts/generate-icon.mjs
    # lint keeps the release gated on style; npm run build typechecks and emits dist/
    - npm run lint
    - npm run build

# The PyInstaller binary only matters for releases; bundle it on v* tags only,
# not on the default branch or MR pushes.
build:
  stage: build
  # build is deliberately decoupled from `test` (parallel, both waiting only on
  # the frontend producer job + build-image): the frontend quality gate (lint +
  # typecheck) lives in the `frontend` job that this job and build-windows both
  # consume.
  needs:
    - job: build-image
      optional: true
    - job: frontend
  before_script:
    - *setup_venv
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  artifacts:
    name: edi-$CI_COMMIT_TAG
    paths:
      - dist-app/edi
    expire_in: 30 days
  script:
    # PKG archive at zlib level 1 (default is 9, level 6 was ~2x): ~3x faster
    # pack step; the binary grows ~18 MiB but every release wrapper (.deb/.rpm/
    # .tar.gz/.AppImage) recompresses it anyway.
    - PYINSTALLER_ZLIB_COMPRESSION_LEVEL=1 .venv/bin/pyinstaller --clean --distpath dist-app --workpath build edi.spec
    # EDI_SELFTEST=1 makes the binary print "SELFTEST {...}" (or
    # "SELFTEST_TIMEOUT" after 25s) and exit 0/1 accordingly; rely on the exit
    # code, not grep, so a timeout line can't be mistaken for success. The
    # outer `timeout` is only a last-resort backstop if the process hangs.
    # The onefile unpack (~450 MB) goes to $TMPDIR; point it at the runner's
    # disk (build/tmp) since /tmp is often a small tmpfs and a full write makes
    # the bootloader fail with "decompression resulted in return code -1".
    - mkdir -p build/tmp
    - TMPDIR="$CI_PROJECT_DIR/build/tmp" EDI_SELFTEST=1 timeout 60 ./dist-app/edi

# Windows onefile + NSIS installer, built on a GitLab-hosted Windows runner
# (`saas-windows-medium-amd64`, PowerShell shell, elevated) because PyInstaller
# cannot cross-compile — the Windows binary MUST be produced on Windows.
# Windows runners take no image/services (shell executor; the inherited
# default.image is ignored). The frontend `dist/` and the app icons come from
# the `frontend` job artifacts (byte-identical on every platform), so this job
# needs NO Node/npm at all — it only gates Python >= 3.10 (Chocolatey fallback).
# It builds the onefile, runs the offscreen selftest (verdict via
# EDI_SELFTEST_OUT), then makes the versioned .exe + NSIS installer. Like
# `build`, only on v* tags; the .exe artifacts feed the `release` job via
# `needs`.
build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  needs:
    - job: build-image
      optional: true
    - job: frontend
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  # pip (venv + PySide6 + pyinstaller) dominates this job's wall time (~20 min)
  # on the Windows runner; caching pip's downloads makes repeat runs near-free.
  # Job-level cache overrides the global .npm one (this job has no Node).
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - build/.pip-cache/
  artifacts:
    name: edi-win-$CI_COMMIT_TAG
    paths:
      - dist-app/Edi-*.exe
    expire_in: never
  script:
    - .\scripts\build-windows.ps1 -Version "$env:CI_COMMIT_TAG"

# Wraps the onefile binary into versioned .deb/.rpm/.tar.gz/.AppImage
# artifacts (scripts/package-linux.sh). Runs only on v* tags; the names embed
# the release version from the tag (e.g. v0.2.4 -> edi_0.2.4_amd64.deb).
package:
  stage: package
  before_script:
    - *setup_venv
  needs:
    - build
    - job: build-image
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  artifacts:
    paths:
      - dist-app/edi_*.deb
      - dist-app/edi-*.rpm
      - dist-app/edi-*.tar.gz
      - dist-app/Edi-*.AppImage
    expire_in: never
  script:
    - ./scripts/package-linux.sh dist-app/edi "${CI_COMMIT_TAG#v}"

release:
  stage: release
  # Only needs bash (version.sh) + git for the changelog + curl for glab — all
  # in the builder image. Runs rarely (tag pushes), so keep it light. The
  # Windows binaries (built by build-windows) are pulled in alongside the Linux
  # packages via the needs edge.
  needs:
    - package
    - build-windows
    - job: build-image
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  # GLAB_ENABLE_CI_AUTOLOGIN makes glab authenticate with the predefined
  # CI_JOB_TOKEN (JOB-TOKEN header) instead of a PRIVATE-TOKEN.
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - curl -sL "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION#v}/downloads/glab_${GLAB_VERSION#v}_linux_amd64.tar.gz" | tar -xz -C /tmp
    # The runner checks out a shallow clone (depth 20), so fetch full history
    # and all tags to build a changelog against the previous release. If the
    # repo is already complete (fewer commits than the depth), --unshallow
    # errors and a plain tag fetch is enough.
    - git fetch --tags --prune --unshallow 2>/dev/null || git fetch --tags --prune
    # Refuse to publish if the tag does not match the version declared in
    # package.json / backend/__init__.py (kept in sync by scripts/version.sh).
    - |
      if [ "${CI_COMMIT_TAG}" != "v$(./scripts/version.sh current)" ]; then
        echo "error: tag ${CI_COMMIT_TAG} does not match declared version $(./scripts/version.sh current)" >&2
        exit 1
      fi
    # Generate the changelog: every commit since the previous tag (or the full
    # history for the first release) as "- <short-hash> <subject>" lines. The
    # short hashes are auto-linked to commits by GitLab.
    - |
      PREV_TAG=$(git describe --abbrev=0 --tags "${CI_COMMIT_TAG}^" 2>/dev/null || true)
      RANGE="${CI_COMMIT_TAG}"
      [ -n "$PREV_TAG" ] && RANGE="${PREV_TAG}..${CI_COMMIT_TAG}"
      printf '## Changes in %s\n\n' "$CI_COMMIT_TAG" > /tmp/CHANGELOG.md
      git log --pretty=format:'- %h %s' "$RANGE" >> /tmp/CHANGELOG.md
      printf '\n' >> /tmp/CHANGELOG.md
    # A CI job token can access the Releases/Packages APIs but not the generic
    # /uploads endpoint (401 Unauthorized), so glab publishes the artifacts to
    # the generic package registry instead and links them to the release.
    - /tmp/bin/glab release create "$CI_COMMIT_TAG"
      --name "Edi $CI_COMMIT_TAG"
      --notes-file /tmp/CHANGELOG.md
      --ref "$CI_COMMIT_SHA"
      --use-package-registry
      dist-app/edi_*.deb
      dist-app/edi-*.rpm
      dist-app/edi-*.tar.gz
      dist-app/Edi-*.AppImage
      dist-app/Edi-*.exe
