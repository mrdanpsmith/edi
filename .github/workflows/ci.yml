# CI for Edi (GitHub Actions) — replaced the GitLab pipeline.
#
# Normal commit pipeline: runs on every pull request and on every push to
# main / release/* branches, and runs ONLY the testing phases (lint, typecheck,
# dupcheck, frontend build + unit tests, backend pytest, security audits). It
# never builds binaries or creates releases — the tag-gated full DAG (platform
# builds, packaging, publishing) lives in release.yml.
#
# Frontend + test jobs also exist (byte-identical copies) in release.yml so a
# tag run gets the same gate; the shared job bodies are duplicated on purpose.
#
# Jobs run in pre-built images pushed to ghcr.io by images.yml:
#   * <owner>/edi-builder:jammy — Ubuntu 22.04 (glibc 2.35) + Qt runtime libs,
#     Node 22, venv at /opt/edi/venv (PySide6==6.11.1, pyinstaller==6.22.0,
#     pytest, pytest-qt, pytest-cov, bandit, pip-audit). Used by the test job.
# The venv is a read-only image layer — never pip-install at job time; bake
# changes into the images (images.yml). Nodes: images must exist in ghcr before
# the first CI run (run images.yml manually once after import).

name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  # PRs get the same gate, so a branch is checked before it is merged and the
  # coverage upload lands on the PR (github-code-quality[bot]'s summary and the
  # uncovered-changed-lines annotations) instead of only on the default branch.
  # Fork PRs run the whole gate with a read-only token; the coverage upload
  # steps skip themselves (actions/upload-code-coverage checks the PR head
  # repository itself) rather than failing on the missing code-quality: write.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  # Chromium in containers: /dev/shm is tiny and the GPU is absent, so
  # QtWebEngine can hang while loading pages. Force software rendering and
  # temp-file-backed shared memory.
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-dev-shm-usage --disable-gpu"
  PYTHONUNBUFFERED: "1"

# The frontend bundle and icons are byte-identical on every platform, and the
# backend tests load dist/index.html, so produce dist/ once and hand it to the
# test job. Also gates style (lint) + typecheck + duplicate-code scan.
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate icons (ico + icns; png is committed)
        run: node scripts/generate-icon.mjs
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Duplicate-code scan
        run: npm run dupcheck
      - name: Build frontend (dist/)
        run: npm run build
      - name: Upload frontend artifacts (dist + icons)
        uses: actions/upload-artifact@v7
        with:
          name: edi-web
          path: |
            dist
            scripts/assets/app-icon.ico
            scripts/assets/app-icon.icns
          if-no-files-found: error
          retention-days: 30

  # The quality gate: frontend unit tests (coverage) + backend pytest (coverage
  # via pytest-cov) + audits. Consumes dist/ from the frontend job (pytest loads
  # it). Network audits run last, after the deterministic gate.
  test:
    needs: frontend
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/edi-builder:jammy
    timeout-minutes: 45
    permissions:
      contents: read
      code-quality: write # GitHub code coverage API (actions/upload-code-coverage)
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: edi-web
          path: .
      - name: Link baked venv (read-only image layer)
        run: ln -s /opt/edi/venv .venv
      - name: Install frontend deps (for vitest)
        run: npm ci --no-audit --no-fund
      - name: Frontend unit tests + coverage
        run: npm run coverage > /tmp/frontend-cov.txt 2>&1
      - name: Bandit (source-security scan)
        run: .venv/bin/bandit -c pyproject.toml -r backend scripts/color-scheme-probe.py scripts/dark-mode-forensics.py scripts/mermaid-label-probe.py run_edi.py -q
      - name: Backend tests + coverage
        run: .venv/bin/pytest tests/ > /tmp/backend-cov.txt 2>&1
      # GitHub's own coverage dashboard (built in, public preview since
      # 2026-05): each Cobertura report uploads as its own labelled report and
      # they render together as one PR summary from github-code-quality[bot],
      # with uncovered changed lines annotated on the Files-changed tab. No
      # third-party service and no upload token; needs code-quality: write.
      # Two knobs keep a reporting hiccup out of the quality gate:
      #   * fail-on-error: false — the API is in preview, so a 5xx, a rejected
      #     payload or a processing timeout must not turn a green run red.
      #   * the `if:` — only the default branch and pull requests, because for
      #     a push to any *other* branch the action shells out to `gh pr list`
      #     to look for a PR, and the builder image ships no `gh` (that path
      #     fails the step). Tags and release/** runs are skipped outright.
      - name: Upload frontend coverage
        if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          fail-on-error: 'false'
      - name: Upload backend coverage
        if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage-py/cobertura-coverage.xml
          language: Python
          label: code-coverage/pytest
          fail-on-error: 'false'
      # The README's two coverage badges are fed from a `badges` branch, not
      # from the code-quality API (it exposes no badge URL), so the reports are
      # handed to the `badges` job below as an artifact. Default branch only:
      # a badge should show the state of main, not of a pull request.
      - name: Stash Cobertura reports for the badge job
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/cobertura-coverage.xml
            coverage-py/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 1
      - name: npm audit
        run: npm run audit
      - name: pip-audit
        run: .venv/bin/pip-audit -r requirements.txt
      - name: Publish coverage summary
        run: |
          printf '## Frontend coverage (Vitest)\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 12 /tmp/frontend-cov.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Backend coverage (pytest-cov)\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 25 /tmp/backend-cov.txt >> "$GITHUB_STEP_SUMMARY"
  # README coverage badges. shields.io can only read a value out of a URL and
  # GitHub's built-in coverage exposes no badge URL, so the percentages are
  # published as JSON to a dedicated `badges` branch that the README's
  # /badge/dynamic/json badges read. Publishing is its own job so the only job
  # holding a write token never runs the test suite, and it needs no builder
  # image: just python3 and git.
  badges:
    name: Coverage badges
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A badge is not a gate: a repo whose default workflow permissions are
    # read-only would cap this job's token and fail the push, and that must not
    # redden main. The step still reports its failure on the run.
    continue-on-error: true
    permissions:
      contents: write # push the `badges` branch
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: reports
      - name: Publish the badge numbers
        env:
          BADGE_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          import xml.etree.ElementTree as ET

          def color(pct):
              if pct >= 90:
                  return "brightgreen"
              return "yellow" if pct >= 80 else "orange" if pct >= 70 else "red"

          reports = (
              ("reports/coverage/cobertura-coverage.xml", "coverage-ts.json", "coverage TS"),
              ("reports/coverage-py/cobertura-coverage.xml", "coverage-py.json", "coverage PY"),
          )
          os.makedirs("badges", exist_ok=True)
          for src, name, label in reports:
              pct = float(ET.parse(src).getroot().get("line-rate")) * 100
              payload = {"schemaVersion": 1, "label": label, "message": f"{pct:.1f}%", "color": color(pct)}
              pathlib.Path("badges", name).write_text(json.dumps(payload) + "\n")
              print(f"{name}: {pct:.1f}% ({payload['color']})")
          PY
          cd badges
          git init -q -b badges
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "coverage badges"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The token rides in an extra header rather than the remote URL, so it
          # cannot be echoed back by a failing push.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BADGE_TOKEN" | base64 -w0)" \
            push --force origin badges
