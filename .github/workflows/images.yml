# Builds and publishes the CI builder image to ghcr.io.
#
# The image keeps the Ubuntu 22.04 (glibc 2.35) base so the PyInstaller bundle
# stays portable to older desktop Linux:
#   * ghcr.io/<owner>/edi-builder:jammy-<hash> — Ubuntu 22.04 + Qt runtime
#     libs, Node 22, and a venv at /opt/edi/venv built from requirements-dev.txt
#     and requirements-build.txt. Every check/build job.
#
# <hash> is a digest of the image's inputs (Dockerfile.ci + requirements*.txt),
# so a tag names exactly one dependency set. This is a reusable workflow:
# ci.yml and release.yml call it as their first job and pass its `image` output
# to every container job, so a run always uses the image built from its own
# commit's inputs — never a stale one, and never racing a rebuild. When the tag
# is already in ghcr the job only checks and exits; otherwise it builds and
# pushes it (layers come from the registry buildx cache).
#
# Jobs never pip-install into the baked venv (a read-only image layer) — bake
# changes into Dockerfile.ci / requirements files instead.

name: Build CI images

on:
  workflow_call:
    inputs:
      force:
        description: Rebuild and re-push the tag even if it already exists.
        type: boolean
        default: false
    outputs:
      image:
        description: The fully-qualified builder image for this commit.
        value: ${{ jobs.images.outputs.image }}
  # Manual run: rebuild the current inputs' tag (e.g. to pick up base-image
  # security updates without changing a dependency).
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and re-push the tag even if it already exists.
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image: ${{ steps.tag.outputs.image }}
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v7

      # The hash covers every file Dockerfile.ci COPYs plus the Dockerfile
      # itself; keep it in step with the Dockerfile's COPY lines. ghcr names
      # must be lowercase, and repository_owner keeps the owner's casing.
      - name: Compute the image tag
        id: tag
        env:
          INPUTS_HASH: ${{ hashFiles('Dockerfile.ci', 'requirements.txt', 'requirements-dev.txt', 'requirements-build.txt') }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/${OWNER,,}/edi-builder"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:jammy-${INPUTS_HASH:0:16}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the tag already exists
        id: exists
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already in ghcr"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE not in ghcr; building it"
          fi

      # A pull request from a fork gets a read-only token and cannot push the
      # image, so a fork PR that changes the image inputs cannot be tested
      # until a maintainer pushes the same inputs from a branch in this repo.
      - name: Refuse to build from a fork
        if: >-
          steps.exists.outputs.found != 'true'
          && github.event.pull_request.head.repo.fork
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          echo "::error::$IMAGE does not exist and a fork PR cannot push it. A maintainer must push these Dockerfile.ci/requirements changes from a branch in this repository first."
          exit 1

      - name: Set up buildx
        if: steps.exists.outputs.found != 'true' || inputs.force
        uses: docker/setup-buildx-action@v3
        with:
          # The default "docker" driver cannot export a registry cache; the
          # docker-container (BuildKit-in-a-container) driver can.
          driver: docker-container

      - name: Build and push edi-builder
        if: steps.exists.outputs.found != 'true' || inputs.force
        uses: docker/build-push-action@v6
        with:
          context: .
          # Must pass the Dockerfile explicitly: the repo also contains a plain
          # "Dockerfile" (the app's container image), which buildx would build by
          # default — an image with no Node and a venv at /app/.venv.
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=registry,ref=${{ steps.tag.outputs.repo }}:cache
          cache-to: type=registry,ref=${{ steps.tag.outputs.repo }}:cache,mode=max
