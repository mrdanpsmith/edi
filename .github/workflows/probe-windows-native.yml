name: Probe Windows native build

# One question, one job, no DAG: is building the Windows binary on a
# GitHub-hosted Windows runner faster than emulating Windows on Linux with
# Wine? That is worth a number rather than an argument, because the Wine job
# costs 30-50m per release and it is the only platform we do not build on its
# own OS -- macOS already builds on macos-15 because "PyInstaller cannot
# cross-compile", which is just as true of Windows, and the native script for
# it has existed all along (scripts/build-windows.ps1).
#
# Why a separate file and not a job in release.yml: dispatching release.yml
# runs EVERY job in it, including the 40-minute Wine build, so a probe there
# would cost the very thing it is trying to measure. This runs alone, and it
# is self-contained (it builds its own dist/ and .ico) because artifacts are
# scoped to a single run, so a standalone run cannot see the previous run's
# edi-web upload.
#
# HOW TO READ THE RESULT
#   Run it, then read the "Set up job" column in the run's job list -- that is
#   the Windows VM spin-up, the one number that decides this. The build step
#   then gives the native build+smoke time. Compare their sum against
#   build-windows (Wine), which is ~30-50m.
#   - Probe materially faster -> promote this into release.yml as the real
#     build-windows job and delete the Wine path.
#   - Probe not faster        -> delete this file and keep the (now cached)
#     Wine job.
#
# Delete this file once the question is answered either way.

on:
  workflow_dispatch:
    inputs:
      ver:
        description: Version to stamp into the exe/installer (no leading v)
        required: false
        default: '0.0.0'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    # Deliberately tight. If the native path needs more than this it is not
    # the answer, and failing fast beats discovering it during a release.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build the frontend (dist/ + app-icon.ico)
        run: |
          npm ci
          node scripts/generate-icon.mjs
          npm run build

      # Everything above is the same work the frontend job does in every
      # pipeline, so it is excluded from the measurement on purpose: what we
      # are timing is the Windows-specific half.
      - name: Measure
        shell: pwsh
        run: |
          "=== Windows-native build starting: $(Get-Date -Format o) ==="
          $v = '${{ github.event.inputs.ver }}'.Trim()
          if (-not $v) { throw "no version supplied" }
          $env:PROBE_VERSION = $v
          "=== version $v ==="

      - name: Build onefile + FULL smoke on real Windows
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Version $env:PROBE_VERSION
          "=== onefile + smoke done: $(Get-Date -Format o) ==="

      - name: Build the NSIS installer
        shell: pwsh
        run: |
          # Native Windows makensis with absolute -D defines, because
          # makensis resolves relative File/OutFile against the SCRIPT's
          # directory rather than the CWD. All four defines are passed
          # explicitly; edi.nsi defaults OUTEXE/ICO if they are omitted, but
          # the absolute forms are what the Wine job used and what we want to
          # keep equivalent.
          choco install nsis -y --no-progress | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed: $LASTEXITCODE" }
          $onefile = (Resolve-Path "dist-app/Edi-$($env:PROBE_VERSION)-win64.exe").Path
          $ico = (Resolve-Path 'scripts/assets/app-icon.ico').Path
          $setup = Join-Path $PWD "dist-app/Edi-$($env:PROBE_VERSION)-win64-setup.exe"
          # The selftest console twin is a build-time artifact, not a release
          # artifact: deleting it here keeps the upload glob to exactly the
          # versioned onefile + the installer.
          Remove-Item 'dist-app/Edi-selftest.exe' -ErrorAction SilentlyContinue
          & makensis "-DVERSION=$($env:PROBE_VERSION)" "-DSETUPEXE=$onefile" "-DICO=$ico" "-DOUTEXE=$setup" packaging/edi.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          "=== installer done: $(Get-Date -Format o) ==="
          Get-ChildItem dist-app | Select-Object Name, Length

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-native-probe
          path: dist-app/Edi-*.exe
          if-no-files-found: error
          retention-days: 7
