# Release pipeline for Edi (GitHub Actions) — replaced the GitLab pipeline.
#
# Runs the full DAG on v* tags (or manual workflow_dispatch with VER defaulting
# to 0.0.0 for pre-tag validation): the same quality gate as push CI
# (frontend + test), the platform binaries, packaging, and the GitHub release
# itself. The normal commit CI (testing phases only, runs on every push to
# main/release branches) lives in ci.yml.
#
# Jobs run in pre-built images pushed to ghcr.io by images.yml:
#   * <owner>/edi-builder:jammy      — Ubuntu 22.04 (glibc 2.35) + Qt runtime
#     libs, Node 22, venv at /opt/edi/venv (PySide6==6.11.1, pyinstaller==6.22.0,
#     pytest, pytest-qt, pytest-cov, bandit, pip-audit). Every check/build job.
# The Wine image (<owner>/edi-wine-builder:jammy) is NOT used by any job here;
# it exists only for the legacy local scripts/build-windows-wine.sh. The
# build-windows job runs on a GitHub-hosted windows-2025 runner and pip
# installs its own venv, because PyInstaller cannot cross-compile and emulating
# Windows made the build 30-50m and unrenderable.
# The venv is a read-only image layer — never pip-install at job time; bake
# changes into the images (images.yml). Nodes: images must exist in ghcr before
# any CI run (run images.yml manually once after import).
#
# The Linux onefile is built inside the SAME glibc 2.35 base, so the packaged
# binary runs on older desktop Linux (Ubuntu 22.04 pin; glibc compatibility is
# guaranteed by construction). macOS is built natively on macos-15 (arm64) by
# scripts/build-macos.sh. Windows is built WITHOUT a Windows host: the wine
# image runs real Windows Python + PyInstaller under WineHQ-staging via
# scripts/build-windows-wine.sh (structural CArchive/PE validation; Wine cannot
# render QtWebEngine). A full render only happens on a real Windows desktop
# (scripts/build-windows.ps1).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # The release version for the platform build scripts: the tag on tag builds,
  # 0.0.0 on manual/validation dispatch (scripts strip the leading v).
  VER: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  # Chromium in containers: /dev/shm is tiny and the GPU is absent, so
  # QtWebEngine can hang while loading pages. Force software rendering and
  # temp-file-backed shared memory.
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-dev-shm-usage --disable-gpu"
  PYTHONUNBUFFERED: "1"

# The frontend bundle and icons are byte-identical on every platform, so produce
# them once and share them with the binary jobs instead of rebuilding per-OS.
# Also gates style (lint) + typecheck + duplicate-code scan.
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate icons (ico + icns; png is committed)
        run: node scripts/generate-icon.mjs
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Duplicate-code scan
        run: npm run dupcheck
      - name: Build frontend (dist/)
        run: npm run build
      - name: Upload frontend artifacts (dist + icons)
        uses: actions/upload-artifact@v7
        with:
          name: edi-web
          path: |
            dist
            scripts/assets/app-icon.ico
            scripts/assets/app-icon.icns
          if-no-files-found: error
          retention-days: 30

  # The quality gate: frontend unit tests (coverage) + backend pytest (coverage
  # via pytest-cov) + audits. Consumes dist/ from the frontend job (pytest loads
  # it). Network audits run last, after the deterministic gate.
  test:
    needs: frontend
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/edi-builder:jammy
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: edi-web
          path: .
      - name: Link baked venv (read-only image layer)
        run: ln -s /opt/edi/venv .venv
      - name: Install frontend deps (for vitest)
        run: npm ci --no-audit --no-fund
      - name: Frontend unit tests + coverage
        run: npm run coverage > /tmp/frontend-cov.txt 2>&1
      - name: Bandit (source-security scan)
        run: .venv/bin/bandit -c pyproject.toml -r backend scripts/color-scheme-probe.py scripts/dark-mode-forensics.py scripts/mermaid-label-probe.py run_edi.py -q
      - name: Backend tests + coverage
        run: .venv/bin/pytest tests/ > /tmp/backend-cov.txt 2>&1
      # The coverage report artifact and the README's badges are published by
      # ci.yml, deliberately not mirrored here: a tag (or workflow_dispatch) run
      # has no branch to publish a baseline for, so both could only ever be
      # skipped — and a tag run's numbers are the same commit main already ran.
      - name: npm audit
        run: npm run audit
      - name: pip-audit
        run: .venv/bin/pip-audit -r requirements.txt
      - name: Publish coverage summary
        run: |
          printf '## Frontend coverage (Vitest)\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 12 /tmp/frontend-cov.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Backend coverage (pytest-cov)\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 25 /tmp/backend-cov.txt >> "$GITHUB_STEP_SUMMARY"

  # PyInstaller onefile; only matters for releases (tag + manual validation).
  build-linux:
    needs: frontend
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/edi-builder:jammy
    timeout-minutes: 45
    env:
      # PKG archive at zlib level 1 (default is 9): ~3x faster pack step; the
      # binary grows ~18 MiB but every release wrapper recompresses it anyway.
      PYINSTALLER_ZLIB_COMPRESSION_LEVEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: edi-web
          path: .
      - name: Link baked venv (read-only image layer)
        run: ln -s /opt/edi/venv .venv
      - name: Build onefile binary
        run: .venv/bin/pyinstaller --clean --distpath dist-app --workpath build edi.spec
      - name: Offscreen smoke test
        # EDI_SELFTEST=1 makes the binary print "SELFTEST {...}" and exit 0/1;
        # rely on the exit code. The onefile unpack (~450 MB) goes to $TMPDIR;
        # point it at the runner's disk since a small tmpfs makes the bootloader
        # fail with "decompression resulted in return code -1".
        run: |
          mkdir -p build/tmp
          TMPDIR="$GITHUB_WORKSPACE/build/tmp" EDI_SELFTEST=1 timeout 60 ./dist-app/edi
      - name: Upload onefile
        uses: actions/upload-artifact@v7
        with:
          name: edi
          path: dist-app/edi
          if-no-files-found: error
          retention-days: 30

  # Windows deliverables WITHOUT a Windows host (see workflow header comment).
  # Windows builds on real Windows. It used to run on ubuntu inside the
  # edi-wine-builder image (Dockerfile.wine + build-windows-wine.sh), which
  # emulated the target: a Wine prefix had to be built from GUI installers
  # under a synthetic X display (~26m), and then PyInstaller's walk of the
  # ~1.5 GB PySide6 tree went through Wine's NT path layer, so a 3-minute
  # build was 3 minutes on a good day and 30-50m on a bad one. Wine can also
  # never import QtWebEngineCore, so its smoke was permanently reduced to the
  # structural check -- the render it existed to perform was impossible there.
  #
  # PyInstaller cannot cross-compile, so this has to be a real Windows Python,
  # and that is all this job is: run the native script (scripts/build-windows.
  # ps1, previously the desktop-only path) on a GitHub-hosted Windows runner.
  # Those runners are pre-warmed -- measured at 4s to provision, 0s "Set up
  # job" -- so this is not the per-job VM spin-up that made GitLab's Windows
  # runners cost minutes. The edi-web artifact carries dist/ + the .ico, so
  # the job needs no Node, exactly as the Wine job did not.
  #
  # The timeout is 45m to match build-linux, not the Wine job's 180m: the
  # stages that justified 180m (wineboot, VC++ redist, the Python installer)
  # do not exist on this runner.
  build-windows:
    needs: frontend
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: edi-web
          path: .
      # venv + pip + PyInstaller + the full offscreen smoke, all in the one
      # script that also stages System32's ICU into the venv so PyInstaller's
      # Qt hooks find the plugins. The version is recomputed per step from the
      # workflow-level VER rather than passed through an env var: each pwsh
      # step is a separate process, so a plain $env: var would not survive.
      - name: Build onefile + full smoke on real Windows
        shell: pwsh
        run: |
          $v = '${{ env.VER }}'.TrimStart('v')
          if (-not $v) { throw "no version" }
          ./scripts/build-windows.ps1 -Version $v
      # Kept as its own step, and kept unconditionally, because it is the gate
      # that still runs when the smoke above is skipped as environmental: the
      # pluginless-bundle defect dies here even on a host that cannot render.
      # Same script the Wine path used, so the two cannot drift.
      - name: Structural bundle check (Qt plugins + ICU in the CArchive)
        shell: pwsh
        run: |
          $v = '${{ env.VER }}'.TrimStart('v')
          $py = (Resolve-Path '.venv-win/Scripts/python.exe').Path
          & $py scripts/check_bundle_contents.py "dist-app/Edi-$v-win64.exe"
          if ($LASTEXITCODE -ne 0) { throw "bundle is missing Qt plugins / ICU: the Qt hooks did not collect them" }
      - name: Build the NSIS installer
        shell: pwsh
        run: |
          # Native Windows makensis with ABSOLUTE -D defines, because makensis
          # resolves relative File/OutFile against the SCRIPT's directory, not
          # the CWD (the same path quirk the Wine job documented).
          #
          # makensis is resolved EXPLICITLY rather than just called by name.
          # Each step is a fresh pwsh whose $env:Path is the runner's, not the
          # post-install one: `choco install nsis` succeeds, then the very next
          # line fails with "The term 'makensis' is not recognized", because
          # nothing re-read the machine/user PATH. (scripts/build-windows.ps1
          # carries the same fix as an Update-Path helper, for the same
          # choco-installs-Python case.) So: re-read the PATH, then look in
          # the real install dirs, and only choco if it is genuinely absent --
          # the hosted Windows image ships NSIS, so that branch usually won't
          # run. The failure message lists where it looked, because a silent
          # "not found" here is what made this fail in the first place.
          function Refresh-Path {
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                        [System.Environment]::GetEnvironmentVariable('Path', 'User')
          }
          $candidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "C:\ProgramData\chocolatey\bin\makensis.exe"
          )
          function Find-Makensis {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($c in $candidates) { if ($c -and (Test-Path $c)) { return $c } }
            return $null
          }
          Refresh-Path
          $mk = Find-Makensis
          if (-not $mk) {
            Write-Host 'makensis not present; installing NSIS via Chocolatey'
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed: $LASTEXITCODE" }
            Refresh-Path
            $mk = Find-Makensis
          }
          if (-not $mk) {
            throw "makensis not found. Looked on PATH and in: $($candidates -join ', ')"
          }
          Write-Host "using makensis: $mk"
          $v = '${{ env.VER }}'.TrimStart('v')
          $onefile = (Resolve-Path "dist-app/Edi-$v-win64.exe").Path
          $ico = (Resolve-Path 'scripts/assets/app-icon.ico').Path
          $setup = Join-Path $PWD "dist-app/Edi-$v-win64-setup.exe"
          # The selftest console twin is a build-time artifact, not a release
          # artifact: deleting it here keeps the upload glob to exactly the
          # versioned onefile + the installer.
          Remove-Item 'dist-app/Edi-selftest.exe' -ErrorAction SilentlyContinue
          & $mk "-DVERSION=$v" "-DSETUPEXE=$onefile" "-DICO=$ico" "-DOUTEXE=$setup" packaging/edi.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          Get-ChildItem dist-app | Select-Object Name, Length
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: edi-win
          path: dist-app/Edi-*.exe
          if-no-files-found: error
          retention-days: 90

  build-macos:
    needs: frontend
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The same edi-web artifact the Linux and Windows builds consume, for the
      # same reason: it is the dist/ the `test` job actually validated. macOS
      # used to build its own frontend and its own icons, so the .app shipped a
      # second, untested build of the UI and the generated .icns in this
      # artifact had no consumer at all. build-macos.sh now ASSERTS the
      # artifact and hard-fails without it -- no rebuild fallback, because a
      # script that regenerates what it was meant to consume turns a broken
      # download into a green build of something else. That is also why this job
      # no longer needs setup-node: nothing here runs npm any more, so all
      # three platform jobs are now structurally the same (checkout, download
      # edi-web, build).
      - uses: actions/download-artifact@v8
        with:
          name: edi-web
          path: .
      - name: Build macOS app + dmg
        run: ./scripts/build-macos.sh "${VER#v}"
      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: edi-macos
          path: dist-app/Edi-*.dmg
          if-no-files-found: error
          retention-days: 90

  # Wraps the onefile into versioned .deb/.rpm/.tar.gz/.AppImage.
  # Named for the platform it packages, matching `build-<platform>` and the
  # script it calls (scripts/package-linux.sh): its output is 100% Linux
  # formats, and a bare `package` read as platform-agnostic in a DAG whose
  # other three jobs all name theirs. Kept separate from `build-linux` on
  # purpose — the onefile is built and smoke-tested once, then wrapped.
  package-linux:
    needs: build-linux
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/edi-builder:jammy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: edi
          path: .
      - name: Link baked venv (read-only image layer)
        run: ln -s /opt/edi/venv .venv
      - name: Locate onefile + restore exec bit (GH artifacts flatten a single-file path and drop POSIX modes)
        run: |
          BIN="dist-app/edi"
          [ -f "$BIN" ] || BIN="edi"
          [ -f "$BIN" ] || { echo "error: onefile not found (looked for dist-app/edi and edi)" >&2; ls -la; exit 1; }
          chmod +x "$BIN"
          echo "EDI_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Wrap onefile into deb/rpm/tar.gz/AppImage
        run: ./scripts/package-linux.sh "$EDI_BIN" "${VER#v}"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: edi-packages
          path: |
            dist-app/edi_*.deb
            dist-app/edi-*.rpm
            dist-app/edi-*.tar.gz
            dist-app/Edi-*.AppImage
          if-no-files-found: error
          retention-days: 90

  # Publishes the GitHub release with all platform artifacts. The changelog is
  # every commit since the previous tag (auto-linked by GitHub).
  release:
    # `test` is here because a quality gate nothing waits on is not a gate: it
    # ran beside the builds and its result was discarded, so a red pytest or
    # vitest run still published binaries. It must stay ungated by an `if:` of
    # its own — a skipped dependency skips its dependents, which would have
    # taken `release` down with it on workflow_dispatch.
    needs: [test, package-linux, build-windows, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags for the git-describe changelog.
          fetch-depth: 0
      # upload-artifact flattens wildcard uploads (paths are preserved only
      # "after the first wildcard"), so every platform artifact unzips flat
      # here. Download all three into one staging dir and enumerate the files
      # with `find` in the release step instead of guessing names.
      - uses: actions/download-artifact@v8
        with:
          name: edi-packages
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: edi-win
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: edi-macos
          path: artifacts
      # Refuse to publish if the tag does not match the version declared in
      # package.json / backend/__init__.py (kept in sync by scripts/version.sh).
      - name: Verify tag matches declared version
        run: |
          if [ "${GITHUB_REF_NAME}" != "v$(./scripts/version.sh current)" ]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match declared version $(./scripts/version.sh current)" >&2
            exit 1
          fi
      - name: Build changelog
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${GITHUB_REF_NAME}"
          [ -n "$PREV_TAG" ] && RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          printf '## Changes in %s\n\n' "$GITHUB_REF_NAME" > /tmp/CHANGELOG.md
          git log --pretty=format:'- %h %s' "$RANGE" >> /tmp/CHANGELOG.md
          printf '\n\n## Upgrading\n\n' >> /tmp/CHANGELOG.md
          printf 'Windows: download and run `Edi-%s-win64-setup.exe` over the existing install (portable users: replace `Edi-%s-win64.exe`); settings and documents are untouched. Linux: upgrade via your package manager. macOS: replace the app bundle. Full instructions in README → Upgrading.\n' "${GITHUB_REF_NAME#v}" "${GITHUB_REF_NAME#v}" >> /tmp/CHANGELOG.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find artifacts -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "error: no release artifacts were downloaded to artifacts/" >&2
            ls -laR artifacts
            exit 1
          fi
          echo "Uploading ${#FILES[@]} release files:"
          printf '  %s\n' "${FILES[@]}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Edi $GITHUB_REF_NAME" \
            --notes-file /tmp/CHANGELOG.md \
            "${FILES[@]}"