<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Only the app's own bundle runs; see docs/architecture.md, "What a document can make the machine do". -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'" />
    <title>Edi</title>
  </head>
  <body>
    <div id="app">
      <nav id="tabbar"></nav>
      <main id="workspace">
        <div id="toolbar" role="toolbar" aria-label="Toolbar"></div>
        <section id="editor-container" aria-label="Editor"></section>
        <section id="home-screen" aria-label="Launcher">
          <h1>Edi</h1>
          <p class="home-subtitle">Markdown editor with Mermaid, spreadsheets, and more</p>
          <div class="home-action-row">
            <button type="button" class="home-btn home-primary" id="home-new">New</button>
            <button type="button" class="home-btn home-primary" id="home-open">Open…</button>
            <button type="button" class="home-btn home-primary" id="home-open-path">Open Path…</button>
          </div>
          <div class="home-recent" id="home-recent" hidden>
            <h2 class="home-section-title">Recent</h2>
            <ul id="home-recent-list" aria-label="Recent documents"></ul>
          </div>
          <div class="home-action-row">
            <button type="button" class="home-btn" id="home-welcome">Welcome</button>
            <button type="button" class="home-btn" id="home-help">Help Guide</button>
            <button type="button" class="home-btn" id="home-functions">Function Reference</button>
            <button type="button" class="home-btn" id="home-exit">Exit</button>
          </div>
          <p class="home-hint">Ctrl+N new · Ctrl+T new tab · Ctrl+O open · Ctrl+Shift+O open path</p>
        </section>
      </main>
      <footer id="statusbar">
        <span id="status-left"></span>
        <span id="status-mode" aria-live="polite"></span>
        <button type="button" id="status-zoom" title="Document zoom — click to reset" hidden></button>
        <span id="status-right"></span>
      </footer>
    </div>
    <noscript>Edi requires JavaScript to run.</noscript>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
