<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Edi</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span id="app-name" aria-hidden="true">Edi</span>
        <span id="doc-title" title=""></span>
        <span id="dirty-indicator" title="Unsaved changes" hidden>*</span>
      </header>
      <nav id="tabbar" role="tablist" aria-label="Documents"></nav>
      <main id="workspace">
        <section id="editor-pane" aria-label="Editor">
          <div id="editor-container"></div>
        </section>
        <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize preview"></div>
        <section id="preview-pane" aria-label="Preview">
          <div id="preview-container"></div>
        </section>
      </main>
      <footer id="statusbar">
        <span id="status-left"></span>
        <span id="status-right"></span>
      </footer>
    </div>
    <noscript>Edi requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
